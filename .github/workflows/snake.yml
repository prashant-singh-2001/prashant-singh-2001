# Place this file at: .github/workflows/snake.yml
# (in your profile repo: prashant-singh-2001/prashant-singh-2001)
#
# After committing it, go to the "Actions" tab → "Generate Snake" → "Run workflow"
# to trigger the first run. It will create an "output" branch containing the SVGs.
# After that it re-runs automatically every 12 hours.

name: Generate Snake

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  # Lets you trigger it manually from the Actions tab
  workflow_dispatch:
  # Also regenerates on every push to main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
